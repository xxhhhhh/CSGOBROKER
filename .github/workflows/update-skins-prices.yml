name: Update skins prices

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-skins-prices
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create target dir
        run: mkdir -p code-parts/topics/skins-data

      - name: Fetch LIS-SKINS raw JSON
        run: |
          curl -L --fail --silent --show-error --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 \
            "https://lis-skins.com/market_export_json/csgo.json" \
            -o code-parts/topics/skins-data/lis-skins.raw.json

      - name: Fetch Skinport raw JSON
        run: |
          curl --compressed -L --fail --silent --show-error --retry 3 --retry-all-errors --connect-timeout 20 --max-time 180 \
            -H "Accept-Encoding: br" \
            "https://api.skinport.com/v1/items?app_id=730&currency=USD&tradable=0" \
            -o code-parts/topics/skins-data/skinport.raw.json

      - name: Validate fresh input
        run: |
          jq -e 'type == "array" and length > 10000' code-parts/topics/skins-data/lis-skins.raw.json >/dev/null
          jq -e 'type == "array" and length > 10000' code-parts/topics/skins-data/skinport.raw.json >/dev/null
          if [ -f code-parts/topics/skins-data/skins-prices.fallback.json ]; then
            jq -e 'type == "array"' code-parts/topics/skins-data/skins-prices.fallback.json >/dev/null
          fi

      - name: Test price calculation
        run: node --test code-parts/topics/skins-data/build-skins-prices.test.mjs

      - name: Build merged prices JSON
        run: node code-parts/topics/skins-data/build-skins-prices.mjs

      - name: Commit and push changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add code-parts/topics/skins-data/skins-prices.json
          git add code-parts/topics/skins-data/skins-prices.fallback.json
          git add code-parts/topics/skins-data/skins-prices.meta.json
          git add code-parts/topics/skins-data/lis-skins.raw.json
          git add code-parts/topics/skins-data/skinport.raw.json
          git add code-parts/topics/skins-data/build-skins-prices.mjs
          git add code-parts/topics/skins-data/build-skins-prices.test.mjs
          if git diff --cached --quiet; then
            echo "Prices unchanged"
          else
            git commit -m "Update skins prices"
            git push
          fi
