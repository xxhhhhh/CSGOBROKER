name: Update skins prices

on:
  schedule:
    - cron: "17 */12 * * *"   # каждые 12 часов
  workflow_dispatch:          # ручной запуск из вкладки Actions

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch latest prices JSON
        run: |
          mkdir -p code-parts/topics
          curl -L --fail --silent --show-error "https://lis-skins.com/market_export_json/csgo.json" -o code-parts/topics/skins-prices.json.tmp
          jq . code-parts/topics/skins-prices.json.tmp > code-parts/topics/skins-prices.json
          rm -f code-parts/topics/skins-prices.json.tmp

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add code-parts/topics/skins-prices.json
          git diff --cached --quiet || git commit -m "Update skins prices"

      - name: Push changes
        run: |
          git push