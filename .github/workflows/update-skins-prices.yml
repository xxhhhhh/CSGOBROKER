name: Update skins prices

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create target dir
        run: mkdir -p code-parts/topics skins-data

      - name: Fetch Lis-Skins raw JSON
        run: |
          curl -L --fail --silent --show-error \
            "https://lis-skins.com/market_export_json/csgo.json" \
            -o code-parts/topics/skins-data/lis-skins.raw.json

      - name: Fetch Skinport raw JSON
        run: |
          curl --compressed -L --fail --silent --show-error \
            -H "Accept-Encoding: br" \
            "https://api.skinport.com/v1/items?app_id=730&currency=USD&tradable=0" \
            -o code-parts/topics/skins-data/skinport.raw.json

      - name: Validate JSON files
        run: |
          jq . code-parts/topics/skins-data/lis-skins.raw.json > /dev/null
          jq . code-parts/topics/skins-data/skinport.raw.json > /dev/null

      - name: Build merged prices JSON
        run: node skins-data/build-skins-prices.mjs

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add code-parts/topics/skins-data/skins-prices.json
          git add code-parts/topics/skins-data/lis-skins.raw.json
          git add code-parts/topics/skins-data/skinport.raw.json
          git add skins-data/build-skins-prices.mjs
          git diff --cached --quiet || git commit -m "Update skins prices"

      - name: Push changes
        run: git push